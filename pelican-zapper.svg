<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <title>Pelican flying into an oversized mosquito zapper</title>
  <desc>A cartoon pelican mid-flight, beak first, colliding with a giant glowing electric racket-style bug zapper. Sparks fly and feathers scatter.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a5a"/>
      <stop offset="1" stop-color="#5b3f8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grid" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb8500"/>
    </linearGradient>
    <clipPath id="gridClip">
      <ellipse cx="720" cy="280" rx="126" ry="161"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="110" cy="90" r="38" fill="#f5f6fa" opacity="0.9"/>
  <circle cx="98" cy="80" r="8" fill="#dcdde1" opacity="0.5"/>
  <circle cx="122" cy="100" r="6" fill="#dcdde1" opacity="0.5"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="240" cy="60" r="2.5"/>
    <circle cx="330" cy="110" r="2"/>
    <circle cx="420" cy="50" r="2.5"/>
    <circle cx="60" cy="200" r="2"/>
    <circle cx="540" cy="80" r="2"/>
    <circle cx="900" cy="40" r="2.5"/>
    <circle cx="180" cy="150" r="2"/>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45">
    <line x1="90" y1="255" x2="200" y2="255"/>
    <line x1="60" y1="305" x2="185" y2="305"/>
    <line x1="100" y1="355" x2="205" y2="355"/>
  </g>

  <!-- oversized zapper -->
  <g transform="rotate(-8 720 300)">
    <ellipse cx="720" cy="280" rx="190" ry="225" fill="url(#glow)"/>
    <!-- handle -->
    <rect x="704" y="438" width="32" height="34" fill="#2f3640"/>
    <rect x="700" y="460" width="40" height="152" rx="18" fill="#57606f" stroke="#2f3640" stroke-width="4"/>
    <circle cx="720" cy="500" r="9" fill="#ff4757" stroke="#2f3640" stroke-width="3"/>
    <g stroke="#2f3640" stroke-width="3" opacity="0.6">
      <line x1="706" y1="540" x2="734" y2="540"/>
      <line x1="706" y1="556" x2="734" y2="556"/>
      <line x1="706" y1="572" x2="734" y2="572"/>
    </g>
    <!-- racket head -->
    <ellipse cx="720" cy="280" rx="152" ry="187" fill="#2f3640" stroke="#1e272e" stroke-width="6"/>
    <ellipse cx="720" cy="280" rx="128" ry="163" fill="url(#grid)" stroke="#a78bfa" stroke-width="3"/>
    <g clip-path="url(#gridClip)" stroke="#c4b5fd" stroke-width="2" opacity="0.8">
      <line x1="600" y1="110" x2="600" y2="450"/>
      <line x1="624" y1="110" x2="624" y2="450"/>
      <line x1="648" y1="110" x2="648" y2="450"/>
      <line x1="672" y1="110" x2="672" y2="450"/>
      <line x1="696" y1="110" x2="696" y2="450"/>
      <line x1="720" y1="110" x2="720" y2="450"/>
      <line x1="744" y1="110" x2="744" y2="450"/>
      <line x1="768" y1="110" x2="768" y2="450"/>
      <line x1="792" y1="110" x2="792" y2="450"/>
      <line x1="816" y1="110" x2="816" y2="450"/>
      <line x1="840" y1="110" x2="840" y2="450"/>
      <line x1="590" y1="136" x2="850" y2="136"/>
      <line x1="590" y1="160" x2="850" y2="160"/>
      <line x1="590" y1="184" x2="850" y2="184"/>
      <line x1="590" y1="208" x2="850" y2="208"/>
      <line x1="590" y1="232" x2="850" y2="232"/>
      <line x1="590" y1="256" x2="850" y2="256"/>
      <line x1="590" y1="280" x2="850" y2="280"/>
      <line x1="590" y1="304" x2="850" y2="304"/>
      <line x1="590" y1="328" x2="850" y2="328"/>
      <line x1="590" y1="352" x2="850" y2="352"/>
      <line x1="590" y1="376" x2="850" y2="376"/>
      <line x1="590" y1="400" x2="850" y2="400"/>
      <line x1="590" y1="424" x2="850" y2="424"/>
    </g>
    <ellipse cx="690" cy="220" rx="60" ry="80" fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- pelican -->
  <g>
    <!-- tail -->
    <path d="M 240 305 L 188 292 L 214 318 L 176 324 L 215 336 L 192 356 L 244 340 Z"
          fill="#f1f2f6" stroke="#dcdde1" stroke-width="2"/>
    <!-- back wing -->
    <path d="M 310 295 Q 255 250 205 245 Q 250 225 305 250 Q 330 262 340 285 Z"
          fill="#dcdde1" stroke="#b2bec3" stroke-width="2"/>
    <!-- legs trailing -->
    <g stroke="#fb8500" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M 300 370 Q 280 398 256 404"/>
      <path d="M 326 374 Q 316 408 292 419"/>
    </g>
    <path d="M 256 404 L 236 398 L 242 412 Z" fill="#fb8500"/>
    <path d="M 292 419 L 272 415 L 279 428 Z" fill="#fb8500"/>
    <!-- body -->
    <ellipse cx="315" cy="320" rx="88" ry="56" fill="#ffffff" stroke="#dcdde1" stroke-width="3"
             transform="rotate(-12 315 320)"/>
    <!-- raised wing -->
    <path d="M 332 288 Q 302 205 252 162 Q 292 168 316 194 Q 306 152 286 122
             Q 330 142 350 186 Q 356 150 346 120 Q 382 162 379 226 Q 376 266 352 292 Z"
          fill="#ffffff" stroke="#dcdde1" stroke-width="3"/>
    <!-- neck -->
    <path d="M 358 300 Q 380 248 436 220 L 472 246 Q 422 266 406 318 Z" fill="#ffffff"/>
    <!-- head -->
    <circle cx="455" cy="222" r="30" fill="#ffffff" stroke="#dcdde1" stroke-width="3"/>
    <path d="M 440 194 Q 436 182 428 178 M 450 192 Q 450 178 444 172" stroke="#dcdde1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- pouch -->
    <path d="M 474 230 C 480 302 520 332 560 312 C 575 304 585 296 589 291 L 476 226 Z"
          fill="url(#pouch)" stroke="#e07b00" stroke-width="2"/>
    <!-- upper beak -->
    <path d="M 476 208 Q 540 234 592 284 L 588 292 Q 534 252 473 228 Z"
          fill="#fb8500" stroke="#e07b00" stroke-width="2"/>
    <!-- panicked eye -->
    <circle cx="450" cy="212" r="10" fill="#ffffff" stroke="#2f3640" stroke-width="2.5"/>
    <circle cx="454" cy="213" r="4.5" fill="#2f3640"/>
    <path d="M 438 197 L 460 202" stroke="#2f3640" stroke-width="3" stroke-linecap="round"/>
    <!-- sweat drop -->
    <path d="M 425 190 Q 420 178 425 172 Q 431 179 429 188 Q 428 193 425 190 Z" fill="#74b9ff"/>
  </g>

  <!-- impact -->
  <g>
    <polygon points="592,244 603,275 636,266 613,290 640,308 606,306 610,340 592,312 570,338 577,305 545,308 572,289 549,266 580,275"
             fill="#ffd32a" stroke="#ff9f1a" stroke-width="3"/>
    <g stroke="#fff200" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="592,290 556,236 576,239 548,192"/>
      <polyline points="592,290 560,352 578,349 552,398"/>
      <polyline points="592,290 648,242 636,262 682,230"/>
      <polyline points="592,290 652,332 640,318 688,352"/>
    </g>
    <!-- scattered feathers -->
    <g fill="#ffffff" stroke="#dcdde1" stroke-width="1.5">
      <path d="M 510 360 Q 522 350 534 360 Q 522 372 510 360 Z" transform="rotate(25 522 360)"/>
      <path d="M 470 392 Q 482 382 494 392 Q 482 404 470 392 Z" transform="rotate(-15 482 392)"/>
      <path d="M 545 410 Q 557 400 569 410 Q 557 422 545 410 Z" transform="rotate(60 557 410)"/>
    </g>
  </g>

  <!-- ZAP! -->
  <text x="480" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64"
        fill="#ffd32a" stroke="#e84118" stroke-width="2.5" transform="rotate(-10 480 140)">ZAP!</text>

</svg>